spring:
  application:
    name: kubemq-example-observability-micrometer
  main:
    # Web server required for Prometheus metrics endpoint
    web-application-type: servlet

# WARNING: Actuator endpoints exposed without authentication. For production, use Spring Security or bind management to a separate loopback port.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true

kubemq:
  address: ${KUBEMQ_ADDRESS:localhost:50000}
  client-id: spring-observability-micrometer
  template:
    observation-enabled: true
